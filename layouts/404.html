{{ define "main" }}
<div style="text-align: center; padding: 4rem 1rem; max-width: 600px; margin: 0 auto;">
    <h1 style="font-family: 'Cinzel', serif; font-size: 3rem; color: var(--accent-color); margin-bottom: 0.5rem;">
        You Rolled a 1
    </h1>
    <p style="font-family: 'Lora', Georgia, serif; font-size: 1.25rem; color: var(--card-text-color-secondary); margin-bottom: 2rem;">
        Critical failure. This page doesn't exist.
    </p>
    <p style="font-family: 'Lora', Georgia, serif; color: var(--card-text-color-tertiary); margin-bottom: 2rem;">
        The scroll you seek has been lost to time, or perhaps it never existed in this realm.
        The Sage's archives may hold what you're looking for.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" style="display: inline-block; background: var(--accent-color); color: var(--accent-color-text); padding: 0.625rem 1.25rem; border-radius: 0.375rem; font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 500; text-decoration: none;">
            Return Home
        </a>
        <a href="/search/" style="display: inline-block; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 0.625rem 1.25rem; border-radius: 0.375rem; font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 500; text-decoration: none;">
            Search Guides
        </a>
    </div>
</div>
{{ end }}
